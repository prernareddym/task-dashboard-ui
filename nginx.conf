server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy to the Task Tracker API (service name "api" in docker-compose)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
