# Full local stack: PostgreSQL + Task Tracker API (built from its GitHub repo) + this UI behind nginx.
# The JWT secret is a throwaway local-only value.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tasktracker
      POSTGRES_PASSWORD: tasktracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktracker -d tasktracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: https://github.com/prernareddym/task-tracker-api.git#main
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tasktracker
      DB_USERNAME: tasktracker
      DB_PASSWORD: tasktracker
      JWT_SECRET: local-dev-only-secret-change-me-0123456789

  ui:
    build: .
    depends_on:
      - api
    ports:
      - "3000:80"
